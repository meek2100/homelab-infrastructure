# /etc/network/vxlan-nm.conf - VXLAN parameters for Debian 12 VM

# VXLAN Connection Configuration
PHYSICAL_IF="ens18"
BRIDGE_IF="br0"
VXLAN_IF="vxlan150"
VXLAN_VNI="150"
DST_PORT="4789"
LOCAL_IP="192.168.1.150"
REMOTE_IP="192.168.1.226"
VXLAN_MTU="1450"

# Failover State Detection
# WiFi bridge AP — pingable only when P1 (WiFi bridge) is up
WIFI_BRIDGE_AP="192.168.1.237"

# Monitoring
CHECK_INTERVAL="60"
FAIL_THRESHOLD="3"
GATEWAY_IP="192.168.1.1"
DEBUG="0"
LOG_FILE="/var/log/vxlan-nm.log"

# Test suite (used by failover-tester.py)
TEST_REMOTE_SSH_USER="root"
SSH_PRIVATE_KEY_PATH="/home/meek2100/.ssh/id_ed25519"
