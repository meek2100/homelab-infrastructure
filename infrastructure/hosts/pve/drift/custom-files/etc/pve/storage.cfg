dir: local
	path /var/lib/vz
	content iso,vztmpl,backup

lvmthin: local-lvm
	thinpool data
	vgname pve
	content images,rootdir

# lvmthin: shared-nas
#	thinpool shared-nas
#	vgname shared-nas
#	content rootdir,images
#	nodes pve

dir: backup
	path /mnt/pve/backup
	content import,vztmpl,backup,snippets,iso
	is_mountpoint 1
	shared 0

dir: backup2
	path /mnt/pve/backup2
	content vztmpl,backup,import,iso,snippets
	shared 0

dir: backup-sd
	path /mnt/pve/backup-sd
	content import,backup,vztmpl,iso,snippets
	shared 0

