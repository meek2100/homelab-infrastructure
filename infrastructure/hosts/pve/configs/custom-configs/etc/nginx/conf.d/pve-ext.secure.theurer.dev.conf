server {
    listen 80;
    listen [::]:80;
    server_name pve-ext.secure.theurer.dev;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pve-ext.secure.theurer.dev;

    ssl_certificate /etc/letsencrypt/live/secure.theurer.dev-wild/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/secure.theurer.dev-wild/privkey.pem;
 #   ssl_certificate /etc/pve/local/pveproxy-ssl.pem;
 #   ssl_certificate_key /etc/pve/local/pveproxy-ssl.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE+AESGCM:CHACHA20';
    ssl_ecdh_curve secp384r1;
    ssl_session_timeout 10m;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    proxy_redirect off; # Important for Proxmox VE
	
    access_log /var/log/nginx/pve-ext.secure.theurer.dev.access.log;
    error_log /var/log/nginx/pve-ext.secure.theurer.dev.error.log;

    location / {
        proxy_pass https://10.25.25.250:8006; # Proxy to the Proxmox VE IP and default port
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        client_max_body_size 0;
        proxy_connect_timeout 3600s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        send_timeout 3600s;
    }
}