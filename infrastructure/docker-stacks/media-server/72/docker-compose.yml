  calibre-web-automated:
    image: crocodilestick/calibre-web-automated:latest
    container_name: calibre-web-automated
    environment:
      - PUID=${PUID}
      - PGID=${GUID}
      - TZ=${TZ}
    volumes:
      - ${BASE_PATH}/calibre-web-automated/config:/config
      - ${NFS_MOUNT_POINT}/content/ebooks:/calibre-library
      - ${NFS_MOUNT_POINT}/share/cwa-book-ingest:/cwa-book-ingest
      - ${NFS_MOUNT_POINT}:/mnt/media:rw

    ports:
      - 8083:8083 # Change the first number to change the port you want to access the Web UI, not the second
    restart: unless-stopped
    networks:
      - media-network

  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    container_name: audiobookshelf
    environment:
      - PUID=${PUID}
      - PGID=${GUID}
      - TZ=${TZ}
    volumes:
      - ${BASE_PATH}/audiobookshelf/config:/config
      - ${NFS_MOUNT_POINT}:/mnt/media:rw
    ports:
      - "13378:80"
    restart: unless-stopped
    networks:
      - media-network

