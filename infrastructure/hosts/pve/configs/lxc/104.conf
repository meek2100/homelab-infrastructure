# Unprivileged Sub-ID Mapping (maps container UID/GID 1000 to host 1000)
# Dual-GPU CGroup Device Access%3A
# Character major 195 (NVIDIA), major 235 (NVIDIA UVM), major 226 (DRI card/render)
# Device bind mounts
# Bind host NVIDIA 550.163.01 libraries into container
# NVIDIA 550.163.01 host library mounts
# NVIDIA Vulkan ICD and GLX mounts
# Whole NVIDIA current driver directory mount
arch: amd64
cores: 4
features: nesting=1,keyctl=1
hostname: compute-server
memory: 8192
mp0: /mnt/media,mp=/mnt/media
net0: name=eth0,bridge=vmbr0,firewall=1,gw=192.168.40.1,hwaddr=BC:24:11:71:CE:78,ip=192.168.40.246/24,tag=40,type=veth
onboot: 1
ostype: debian
rootfs: local-lvm:vm-104-disk-0,size=32G
swap: 1024
unprivileged: 1
lxc.idmap: u 0 100000 1000
lxc.idmap: g 0 100000 1000
lxc.idmap: u 1000 1000 1
lxc.idmap: g 1000 1000 1
lxc.idmap: u 1001 101001 64535
lxc.idmap: g 1001 101001 64535
lxc.mount.entry: /etc/vulkan/icd.d/nvidia_icd.json etc/vulkan/icd.d/nvidia_icd.json none bind,optional,create=file
lxc.mount.entry: /usr/share/vulkan/icd.d/nvidia_icd.json usr/share/vulkan/icd.d/nvidia_icd.json none bind,optional,create=file
lxc.cgroup2.devices.allow: c 195:* rwm
lxc.cgroup2.devices.allow: c 226:* rwm
lxc.cgroup2.devices.allow: c 505:* rwm
lxc.cgroup2.devices.allow: c 508:* rwm
lxc.mount.entry: /dev/nvidia0 dev/nvidia0 none bind,optional,create=file
lxc.mount.entry: /dev/nvidiactl dev/nvidiactl none bind,optional,create=file
lxc.mount.entry: /dev/nvidia-modeset dev/nvidia-modeset none bind,optional,create=file
lxc.mount.entry: /dev/nvidia-uvm dev/nvidia-uvm none bind,optional,create=file
lxc.mount.entry: /dev/nvidia-uvm-tools dev/nvidia-uvm-tools none bind,optional,create=file
lxc.mount.entry: /dev/nvidia-caps/nvidia-cap1 dev/nvidia-caps/nvidia-cap1 none bind,optional,create=file
lxc.mount.entry: /dev/nvidia-caps/nvidia-cap2 dev/nvidia-caps/nvidia-cap2 none bind,optional,create=file
lxc.mount.entry: /dev/dri dev/dri none bind,optional,create=dir
lxc.mount.entry: /usr/local/bin/nvidia-smi usr/local/bin/nvidia-smi none bind,optional,create=file
lxc.mount.entry: /usr/lib/x86_64-linux-gnu/nvidia/current usr/lib/x86_64-linux-gnu/nvidia/current none bind,ro,optional,create=dir
