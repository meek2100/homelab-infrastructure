# Pushover and SMTP notification credentials template for Alertmanager
# Encrypt with SOPS using: sops -e secrets.example.yaml > secrets.enc.yaml
PUSHOVER_USER_KEY: "your-pushover-user-key"
PUSHOVER_APP_TOKEN: "your-pushover-application-api-token"

SMTP_SMARTHOST: "smtp.gmail.com:587"
SMTP_FROM: "alerts@theurer.dev"
SMTP_USER: "alerts@theurer.dev"
SMTP_PASS: "your-smtp-app-password"
SMTP_TO: "darin@theurer.dev"

# Grafana admin password — written to the compose .env (mode 600) by deploy-monitoring-stack.py.
# No single quotes or newlines.
GRAFANA_ADMIN_PASSWORD: "change-me"
