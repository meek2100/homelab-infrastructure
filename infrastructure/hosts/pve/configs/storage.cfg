dir: local
	path /var/lib/vz
	content iso,backup,vztmpl

lvmthin: local-lvm
	thinpool data
	vgname pve
	content rootdir,images

dir: backup
	path /mnt/pve/backup
	content vztmpl,snippets,iso,import,backup
	is_mountpoint 1
	shared 0

dir: backup2
	path /mnt/pve/backup2
	content vztmpl,snippets,iso,backup,import
	shared 0

dir: backup-sd
	path /mnt/pve/backup-sd
	content import,backup,snippets,iso,vztmpl
	shared 0

pbs: pbs-backup
	datastore homelab-datastore
	server 192.168.1.244
	content backup
	encryption-key 55:67:8b:75:89:af:4f:a7:ea:14:40:88:46:5b:64:29:ec:13:89:a2:68:df:34:90:a8:3d:f0:15:93:1e:29:d0
	fingerprint 02:9a:df:82:ab:b9:d4:f9:cf:d5:0a:9a:da:56:00:42:01:23:3c:9c:8d:8f:6f:cf:18:5e:9a:23:6e:f7:52:ff
	namespace pve
	prune-backups keep-all=1
	username pve-backup@pbs!backup-token

