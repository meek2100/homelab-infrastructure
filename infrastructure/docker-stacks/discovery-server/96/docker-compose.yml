services:

  # 1. The Autoheal Daemon: Monitors labeled containers and restarts them if unhealthy
  autoheal:
    image: willfarrell/autoheal:latest
    container_name: autoheal
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock # Required to issue restart commands

  vpn-restarter:
    image: docker:cli
    container_name: vpn-restarter
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: |
      /bin/sh -c '
      echo "Ensuring initial MTU 1280 on Gluetun..."
      while [ "$$(docker inspect -f "{{.State.Health.Status}}" gluetun 2>/dev/null)" != "healthy" ]; do
        sleep 3
      done
      docker exec gluetun ip link set dev tun0 mtu 1280
      echo "Initial MTU locked at 1280."
      echo "Watching Gluetun for restarts..."
      # Grab the exact timestamp Gluetun started
      LAST_START=$$(docker inspect -f "{{.State.StartedAt}}" gluetun 2>/dev/null)
      while true; do
        sleep 10
        CURRENT_START=$$(docker inspect -f "{{.State.StartedAt}}" gluetun 2>/dev/null)
        # If the start time changed, Gluetun was restarted
        if [ "$$CURRENT_START" != "" ] && [ "$$LAST_START" != "$$CURRENT_START" ]; then
          echo "Gluetun restart detected! Waiting for tunnel..."
          # Wait patiently until Gluetun connects and reports healthy
          while [ "$$(docker inspect -f "{{.State.Health.Status}}" gluetun 2>/dev/null)" != "healthy" ]; do
            sleep 5
          done
          echo "Enforcing MTU 1280 on tun0..."
          docker exec gluetun ip link set dev tun0 mtu 1280
          echo "Gluetun is healthy and MTU locked. Restarting dependent containers..."
          # Find all containers with the dependency label and restart them
          for c in $$(docker ps -aq --filter label=vpn-dependent=true); do
            docker restart $$c
          done
          # Log the new start time and resume watching
          LAST_START=$$CURRENT_START
          echo "Recovery complete. Resuming watch..."
        fi
      done'

  gluetun:
    image: qmcgaw/gluetun
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ${BASE_PATH}/pia/pia-shared:/pia-shared
    environment:
#      - DNS_UPSTREAM_RESOLVER_TYPE=doh
#      - DNS_UPSTREAM_RESOLVERS=quad9
      - DNS_UPSTREAM_RESOLVER_TYPE=plain
      - DNS_UPSTREAM_PLAIN_ADDRESSES=10.0.0.242:53,10.0.0.243:53
      - FIREWALL_OUTBOUND_SUBNETS=10.0.0.242/32,10.0.0.243/32
      - PMTUD_ICMP_ADDRESSES=10.0.0.242,10.0.0.243
      - PMTUD_TCP_ADDRESSES=10.0.0.242:53,10.0.0.243:53
      - HEALTH_TARGET_ADDRESSES=audiobookbay.lu,audiobookbay.fi,audiobookbay.nl,audiobookbay.is
      - HEALTH_ICMP_TARGET_IPS=10.0.0.242,10.0.0.243
      - PMTU_DISCOVERY=off
      - DNS_UPSTREAM_IPV6=off
#      - WIREGUARD_MTU=1280
      - OPENVPN_FLAGS=--tun-mtu 1280
      - OPENVPN_TUN_MTU=1280
      - OPENVPN_MSSFIX=1240
      - VPN_SERVICE_PROVIDER=private internet access
      - OPENVPN_USER=${PIA_USER}
      - OPENVPN_PASSWORD=${PIA_PASS}
      - SERVER_REGIONS=Switzerland,Netherlands,SE Stockholm,Romania
      - SERVER_SELECTION_VPN_PORT_FORWARDING_ONLY=yes
      - PORT_FORWARD_ONLY=true
      - VPN_PORT_FORWARDING=on
      - VPN_PORT_FORWARDING_STATUS_FILE=/pia-shared/port.dat
    ports:
#      - 8000:8000 # Built-in HTTP control server
#      - 9898:9898/tcp # HTTP proxy
#      - 8388:8388/tcp # Shadowsocks
#      - 8388:8388/udp # Shadowsocks
      - 8080:8080 # qBittorrent
      - 3000:3000 # Firefox HTTP
      - 3001:3001 # Firefox HTTPS
      - 5077:5077 # audiobookbay-downloader (development alt) 
      - 5078:5078 # audiobookbay-downloader (development)   
      - 5079:5079 # audiobookbay-downloader (control-prod)
      - 5800:5800 # Firefox HTTPS
      - 5900:5900 # Firefox VNC
      - 8112:8112 # audiobookbay-downloader (control-prod)
      - 9091:9091 # audiobookbay-downloader (control-prod)
    restart: unless-stopped
    extra_hosts:
      - "library.gift=193.218.118.42"
      - "download.library.gift=176.119.25.72"
    networks:
       - vpn-network
    # 2. Tell Autoheal to watch this container
    labels:
      - autoheal=true
    healthcheck:
      test: ["CMD", "/gluetun-entrypoint", "healthcheck"]
      interval: 10s       
      timeout: 10s        
      retries: 3          
      start_period: 90s

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: "service:gluetun"
    environment:
      - PUID=${PUID}
      - PGID=${GUID}
      - TZ=${TZ}
    volumes:
      - ${BASE_PATH}/qbittorrent/config:/config
      - ${BASE_PATH}/qbittorrent/incomplete:/downloads/incomplete:rw
      - ${NFS_MOUNT_POINT}:/mnt/media:rw
    restart: unless-stopped
    depends_on:
      gluetun:
        condition: service_healthy
    # 3. Tell Autoheal to watch Firefox, and give Firefox a way to know if its network died
    labels:
      - autoheal=true
      - vpn-dependent=true
    healthcheck:
      # If Gluetun drops or restarts, this curl fails, triggering a Firefox restart to fix the namespace
      test: ["CMD-SHELL", "ping -c 1 -W 3 10.0.0.242 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s

  qbittorrent-porthelper:
    image: scotte/qbittorrent-porthelper:latest
    container_name: qbittorrent-porthelper
    environment:
      - PUID=${PUID}
      - PGID=${GUID}
      - TZ=${TZ}
      - HOST=${QBIT_IP}
      - USERNAME=${QBIT_USER}
      - PASSWORD=${QBIT_PASS}
    volumes:
      - ${BASE_PATH}/pia/pia-shared:/piashared
    restart: unless-stopped
    networks:
       - vpn-network
    depends_on:
      qbittorrent:
        condition: service_healthy
    # 3. Tell Autoheal to watch Firefox, and give Firefox a way to know if its network died
    labels:
      - autoheal=true
      - vpn-dependent=true
    healthcheck:
      # If Gluetun drops or restarts, this curl fails, triggering a Firefox restart to fix the namespace
      test: ["CMD-SHELL", "ping -c 1 -W 3 10.0.0.242 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s

  firefox:
    image: jlesage/firefox-esr:latest
    container_name: firefox
    mem_limit: 640m
    shm_size: "192m"
    network_mode: "service:gluetun"
    environment:
      - USER_ID=${PUID}
      - GROUP_ID=${GUID}
      - TZ=${TZ}
      - DISPLAY_WIDTH=1280
      - DISPLAY_HEIGHT=720
      - KEEP_APP_RUNNING=1
      - CLEAN_TMP_DIR=1
      # Disable background baseimage services:
      - WEB_AUDIO=0
      - WEB_FILE_MANAGER=0
      - WEB_NOTIFICATION=0
      # Automatically apply low-resource Firefox preferences on startup:
      - FF_PREF_PROCESS_COUNT=dom.ipc.processCount=2
      - FF_PREF_LOW_MEM_UNLOAD=browser.tabs.unloadOnLowMemory=true
      - FF_PREF_TAB_UNLOAD_TIMEOUT=browser.tabs.min_inactive_duration_before_unload=300000
      - FF_PREF_NO_AUTOPLAY=media.autoplay.default=5
      - FF_PREF_NO_WEBRTC=media.peerconnection.enabled=false
      - FF_PREF_MEM_CACHE=browser.cache.memory.capacity=32768
      - FF_PREF_DISK_CACHE=browser.cache.disk.enable=false
      - FF_PREF_NO_PREFETCH=network.prefetch-next=false
    volumes:
      - ${BASE_PATH}/firefox/config:/config:rw
      - ${NFS_MOUNT_POINT}/share/browser-downloads:/config/downloads:rw
      - ${NFS_MOUNT_POINT}:/mnt/media:rw
    restart: unless-stopped
    depends_on:
      gluetun:
        condition: service_healthy
    labels:
      - autoheal=true
      - vpn-dependent=true

