# SNMP Exporter configuration for Araknis Homelab Fleet
# Modern snmp_exporter auth-split format (v0.20+)
auths:
  public_v2:
    version: 2
    community: homelab-metrics
  public:
    version: 2
    community: public

modules:
  if_mib:
    walk:
      - 1.3.6.1.2.1.1.1 # sysDescr
      - 1.3.6.1.2.1.1.3 # sysUpTime
      - 1.3.6.1.2.1.1.5 # sysName
      - 1.3.6.1.2.1.2.2.1.1 # ifIndex
      - 1.3.6.1.2.1.2.2.1.2 # ifDescr
      - 1.3.6.1.2.1.2.2.1.3 # ifType
      - 1.3.6.1.2.1.2.2.1.5 # ifSpeed
      - 1.3.6.1.2.1.2.2.1.7 # ifAdminStatus
      - 1.3.6.1.2.1.2.2.1.8 # ifOperStatus
      - 1.3.6.1.2.1.2.2.1.10 # ifInOctets
      - 1.3.6.1.2.1.2.2.1.14 # ifInErrors
      - 1.3.6.1.2.1.2.2.1.16 # ifOutOctets
      - 1.3.6.1.2.1.2.2.1.20 # ifOutErrors
      - 1.3.6.1.2.1.31.1.1.1.1 # ifName
      - 1.3.6.1.2.1.31.1.1.1.6 # ifHCInOctets
      - 1.3.6.1.2.1.31.1.1.1.10 # ifHCOutOctets
      - 1.3.6.1.2.1.31.1.1.1.15 # ifHighSpeed
      - 1.3.6.1.2.1.31.1.1.1.18 # ifAlias
    metrics:
      - name: sysDescr
        oid: 1.3.6.1.2.1.1.1
        type: DisplayString
        help: A textual description of the entity - 1.3.6.1.2.1.1.1
      - name: sysUpTime
        oid: 1.3.6.1.2.1.1.3
        type: gauge
        help: The time since the network management portion of the system was last re-initialized - 1.3.6.1.2.1.1.3
      - name: sysName
        oid: 1.3.6.1.2.1.1.5
        type: DisplayString
        help: An administratively-assigned name for this managed node - 1.3.6.1.2.1.1.5
      - name: ifIndex
        oid: 1.3.6.1.2.1.2.2.1.1
        type: gauge
        help: A unique value for each interface - 1.3.6.1.2.1.2.2.1.1
        indexes:
          - labelname: ifIndex
            type: gauge
      - name: ifDescr
        oid: 1.3.6.1.2.1.2.2.1.2
        type: DisplayString
        help: A textual string containing information about the interface - 1.3.6.1.2.1.2.2.1.2
        indexes:
          - labelname: ifIndex
            type: gauge
      - name: ifAdminStatus
        oid: 1.3.6.1.2.1.2.2.1.7
        type: gauge
        help: The desired state of the interface - 1.3.6.1.2.1.2.2.1.7
        indexes:
          - labelname: ifIndex
            type: gauge
      - name: ifOperStatus
        oid: 1.3.6.1.2.1.2.2.1.8
        type: gauge
        help: The current operational state of the interface - 1.3.6.1.2.1.2.2.1.8
        indexes:
          - labelname: ifIndex
            type: gauge
      - name: ifInOctets
        oid: 1.3.6.1.2.1.2.2.1.10
        type: counter
        help: The total number of octets received on the interface - 1.3.6.1.2.1.2.2.1.10
        indexes:
          - labelname: ifIndex
            type: gauge
      - name: ifInErrors
        oid: 1.3.6.1.2.1.2.2.1.14
        type: counter
        help: Inbound packets that contained errors - 1.3.6.1.2.1.2.2.1.14
        indexes:
          - labelname: ifIndex
            type: gauge
      - name: ifOutOctets
        oid: 1.3.6.1.2.1.2.2.1.16
        type: counter
        help: The total number of octets transmitted out of the interface - 1.3.6.1.2.1.2.2.1.16
        indexes:
          - labelname: ifIndex
            type: gauge
      - name: ifOutErrors
        oid: 1.3.6.1.2.1.2.2.1.20
        type: counter
        help: Outbound packets that could not be transmitted because of errors - 1.3.6.1.2.1.2.2.1.20
        indexes:
          - labelname: ifIndex
            type: gauge
      - name: ifName
        oid: 1.3.6.1.2.1.31.1.1.1.1
        type: DisplayString
        help: The textual name of the interface - 1.3.6.1.2.1.31.1.1.1.1
        indexes:
          - labelname: ifIndex
            type: gauge
      - name: ifHCInOctets
        oid: 1.3.6.1.2.1.31.1.1.1.6
        type: counter
        help: The total number of octets received on the interface (64-bit counter) - 1.3.6.1.2.1.31.1.1.1.6
        indexes:
          - labelname: ifIndex
            type: gauge
      - name: ifHCOutOctets
        oid: 1.3.6.1.2.1.31.1.1.1.10
        type: counter
        help: The total number of octets transmitted out of the interface (64-bit counter) - 1.3.6.1.2.1.31.1.1.1.10
        indexes:
          - labelname: ifIndex
            type: gauge
      - name: ifHighSpeed
        oid: 1.3.6.1.2.1.31.1.1.1.15
        type: gauge
        help: An estimate of the interface's current bandwidth in units of 1,000,000 bits per second - 1.3.6.1.2.1.31.1.1.1.15
        indexes:
          - labelname: ifIndex
            type: gauge
      - name: ifAlias
        oid: 1.3.6.1.2.1.31.1.1.1.18
        type: DisplayString
        help: The extension name of the interface as configured by the administrator - 1.3.6.1.2.1.31.1.1.1.18
        indexes:
          - labelname: ifIndex
            type: gauge

  ap_system:
    walk:
      - 1.3.6.1.2.1.1.1 # sysDescr
      - 1.3.6.1.2.1.1.3 # sysUpTime
      - 1.3.6.1.2.1.1.5 # sysName
    metrics:
      - name: sysDescr
        oid: 1.3.6.1.2.1.1.1
        type: DisplayString
        help: A textual description of the entity - 1.3.6.1.2.1.1.1
      - name: sysUpTime
        oid: 1.3.6.1.2.1.1.3
        type: gauge
        help: The time since the network management portion of the system was last re-initialized - 1.3.6.1.2.1.1.3
      - name: sysName
        oid: 1.3.6.1.2.1.1.5
        type: DisplayString
        help: An administratively-assigned name for this managed node - 1.3.6.1.2.1.1.5

  printer_mib:
    walk:
      - 1.3.6.1.2.1.1.1 # sysDescr
      - 1.3.6.1.2.1.1.3 # sysUpTime
      - 1.3.6.1.2.1.1.5 # sysName
      - 1.3.6.1.2.1.43.10.2.1.4 # prtMarkerLifeCount
      - 1.3.6.1.2.1.43.11.1.1.6 # prtMarkerSuppliesDescription
      - 1.3.6.1.2.1.43.11.1.1.8 # prtMarkerSuppliesMaxCapacity
      - 1.3.6.1.2.1.43.11.1.1.9 # prtMarkerSuppliesLevel
      - 1.3.6.1.2.1.43.16.5.1.2 # prtConsoleDisplayBufferText
    metrics:
      - name: sysDescr
        oid: 1.3.6.1.2.1.1.1
        type: DisplayString
        help: A textual description of the entity - 1.3.6.1.2.1.1.1
      - name: sysUpTime
        oid: 1.3.6.1.2.1.1.3
        type: gauge
        help: The time since the network management portion of the system was last re-initialized - 1.3.6.1.2.1.1.3
      - name: sysName
        oid: 1.3.6.1.2.1.1.5
        type: DisplayString
        help: An administratively-assigned name for this managed node - 1.3.6.1.2.1.1.5
      - name: prtMarkerLifeCount
        oid: 1.3.6.1.2.1.43.10.2.1.4
        type: counter
        help: The count of pages produced by this printer - 1.3.6.1.2.1.43.10.2.1.4
        indexes:
          - labelname: hrDeviceIndex
            type: gauge
          - labelname: prtMarkerIndex
            type: gauge
      - name: prtMarkerSuppliesDescription
        oid: 1.3.6.1.2.1.43.11.1.1.6
        type: DisplayString
        help: The description of this supply unit (e.g. Black Cartridge) - 1.3.6.1.2.1.43.11.1.1.6
        indexes:
          - labelname: hrDeviceIndex
            type: gauge
          - labelname: prtMarkerSuppliesIndex
            type: gauge
      - name: prtMarkerSuppliesMaxCapacity
        oid: 1.3.6.1.2.1.43.11.1.1.8
        type: gauge
        help: The maximum capacity of this supply container - 1.3.6.1.2.1.43.11.1.1.8
        indexes:
          - labelname: hrDeviceIndex
            type: gauge
          - labelname: prtMarkerSuppliesIndex
            type: gauge
      - name: prtMarkerSuppliesLevel
        oid: 1.3.6.1.2.1.43.11.1.1.9
        type: gauge
        help: The current level if this supply container - 1.3.6.1.2.1.43.11.1.1.9
        indexes:
          - labelname: hrDeviceIndex
            type: gauge
          - labelname: prtMarkerSuppliesIndex
            type: gauge
        lookups:
          - labels:
              - hrDeviceIndex
              - prtMarkerSuppliesIndex
            labelname: prtMarkerSuppliesDescription
            oid: 1.3.6.1.2.1.43.11.1.1.6
            type: DisplayString
      - name: prtConsoleDisplayBufferText
        oid: 1.3.6.1.2.1.43.16.5.1.2
        type: DisplayString
        help: The message currently displayed on the operator console - 1.3.6.1.2.1.43.16.5.1.2
        indexes:
          - labelname: hrDeviceIndex
            type: gauge
          - labelname: prtConsoleDisplayBufferIndex
            type: gauge

