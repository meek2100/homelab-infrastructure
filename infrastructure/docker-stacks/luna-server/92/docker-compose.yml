services:
  vpn-proxy:
    image: ghcr.io/meek2100/gp-proxy:web_gui_codereview
    container_name: gp-proxy-macvlan
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      #- DNS_SERVERS=192.168.1.185,192.168.1.186
      - LOG_LEVEL=debug
      - VPN_MODE=standard
      - PROXY_MODE=socks5,socks4,socks4a,http,https,ss
      - VPN_PORTAL=lehvpn.snapone.com
      - SPLIT_TUNNEL=false
      - ALLOWED_SUBNETS=192.168.1.0/24,192.168.10.0/24,192.168.20.0/24,192.168.30.0/24,192.168.40.0/24,192.168.50.0/24,192.168.60.0/24,192.168.70.0/24,192.168.80.0/24,192.168.90.0/24,192.168.100.0/24,10.25.25.0/24,10.20.20.0/24
      - LOCAL_SUBNETS=192.168.1.0/24,192.168.10.0/24,192.168.20.0/24,192.168.30.0/24,192.168.40.0/24,192.168.50.0/24,192.168.60.0/24,192.168.70.0/24,192.168.80.0/24,192.168.90.0/24,192.168.100.0/24,10.25.25.0/24,10.20.20.0/24
      - LOCAL_DOMAINS=secure.theurer.dev
      - LOCAL_DNS=192.168.1.185,192.168.1.186
    networks:
      gp_network:
        ipv4_address: 192.168.1.155
        mac_address: 02:F5:58:97:8E:88
    restart: unless-stopped

networks:
  gp_network:
    driver: macvlan
    driver_opts:
      parent: ens18
    ipam:
      config:
        - subnet: 192.168.1.0/24
          gateway: 192.168.1.1