# Start Docker after the NAS mount, so containers don't bind an empty local /mnt/media (Plex would see
# an empty library; backups would write to the VM's own disk). After a full-power restart the NAS VM on
# pve3 can come up minutes after this VM, and 'nofail' does not retry a failed boot-time mount, so
# ExecStartPre retries the mount every 5 s for up to 5 min, then starts Docker anyway (HA/Homebridge on
# luna must not depend on the NAS). '$$' is systemd's escape for a literal '$'.
[Unit]
Wants=mnt-media.mount
After=mnt-media.mount remote-fs.target

[Service]
TimeoutStartSec=600
ExecStartPre=/bin/sh -c 'i=0; while [ $$i -lt 60 ]; do mountpoint -q /mnt/media && exit 0; mount /mnt/media 2>/dev/null; i=$$((i+1)); sleep 5; done; echo "wait-for-nas: /mnt/media not mounted after 5 min, starting Docker anyway" >&2; exit 0'
