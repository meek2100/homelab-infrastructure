server {
    listen 80;
    listen [::]:80;
    server_name filebrowser.secure.theurer.dev;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name filebrowser.secure.theurer.dev;

    ssl_certificate /etc/letsencrypt/live/secure.theurer.dev-wild/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/secure.theurer.dev-wild/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE+AESGCM:CHACHA20';
    ssl_ecdh_curve secp384r1;
    ssl_session_timeout 10m;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    proxy_redirect off;

    access_log /var/log/nginx/filebrowser.secure.theurer.dev.access.log;
    error_log /var/log/nginx/filebrowser.secure.theurer.dev.error.log;

    location / {
        proxy_pass http://192.168.40.247:8084/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
