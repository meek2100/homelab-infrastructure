services:
  hbbs:
    image: rustdesk/rustdesk-server:latest
    container_name: rustdesk-hbbs
    command: hbbs -r 192.168.1.185:21117
    environment:
      - TZ=${TZ}
    ports:
      - "21115:21115"
      - "21116:21116"
      - "21116:21116/udp"
      - "21118:21118"
    volumes:
      - ${BASE_PATH}/rustdesk/data:/root
    restart: unless-stopped

  hbbr:
    image: rustdesk/rustdesk-server:latest
    container_name: rustdesk-hbbr
    command: hbbr
    ports:
      - "21117:21117"
      - "21119:21119"
    environment:
      - TZ=${TZ}
    volumes:
      - ${BASE_PATH}/rustdesk/data:/root
    restart: unless-stopped
