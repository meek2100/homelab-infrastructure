# /etc/sysctl.d/10-arp-strict.conf
# Strict ARP mode for OpenWrt router with dual-path interface layout.
#
# Problem:
#   wl1-sta0 (192.168.1.225) and br-lan/wan (192.168.1.226) both terminate on
#   the same Araknis 830 AP bridge domain — wan via the AP's LAN port (wired),
#   wl1-sta0 via the AP's radio (wireless client). The 830 AP bridges both to
#   the same L2 segment, so ARP broadcasts from wan loop back to wl1-sta0 and
#   vice-versa.
#
#   Linux's default ARP behaviour (arp_ignore=0, arp_announce=0) means any
#   interface can respond to ARP requests for any local IP and can source ARP
#   requests using any local IP. Result: ARP flapping — the Araknis 520/920
#   alternately see 192.168.1.226 at two different MACs (wan's and wl1-sta0's),
#   which stalls TCP connections and confuses the router's neighbor table.
#
# Fix:
#   arp_ignore=1  — only reply to ARP for the IP assigned to the interface the
#                   ARP request arrived on. wl1-sta0 will not answer for .226;
#                   wan/br-lan will not answer for .225.
#   arp_announce=2 — always source outgoing ARP requests with the best IP for
#                   the target subnet on that specific egress interface. Prevents
#                   wl1-sta0 from advertising .226 as its source in gratuitous
#                   ARPs or ARP requests.
#
# These settings are safe and standard practice on multi-homed Linux hosts
# (widely used in BGP ECMP, VRRP, and VXLAN deployments).

net.ipv4.conf.all.arp_ignore    = 1
net.ipv4.conf.all.arp_announce  = 2
net.ipv4.conf.default.arp_ignore   = 1
net.ipv4.conf.default.arp_announce = 2

# Per-interface overrides (belt-and-suspenders — the 'all' knob takes the MAX
# of itself and the per-interface value, so per-iface entries only raise, not lower)
net.ipv4.conf.wl1-sta0.arp_ignore   = 1
net.ipv4.conf.wl1-sta0.arp_announce = 2
net.ipv4.conf.br-lan.arp_ignore     = 1
net.ipv4.conf.br-lan.arp_announce   = 2
net.ipv4.conf.wan.arp_ignore        = 1
net.ipv4.conf.wan.arp_announce      = 2
