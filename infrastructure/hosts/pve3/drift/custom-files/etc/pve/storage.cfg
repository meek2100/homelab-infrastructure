dir: local
	path /var/lib/vz
	content backup,iso,vztmpl

lvmthin: local-lvm
	thinpool data
	vgname pve
	content rootdir,images

lvmthin: shared-nas
	thinpool shared-nas
	vgname shared-nas
	content rootdir,images
	nodes pve3

dir: backup
	path /mnt/pve/backup
	content images,iso,snippets,vztmpl,backup,rootdir
	is_mountpoint 1
	nodes pve3

