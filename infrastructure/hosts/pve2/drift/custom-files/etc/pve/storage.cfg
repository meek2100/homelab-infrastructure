dir: local
	path /var/lib/vz
	content backup,iso,vztmpl

lvmthin: local-lvm
	thinpool data
	vgname pve
	content rootdir,images

dir: backup-sd
	path /mnt/pve/backup-sd
	content backup,snippets,iso,vztmpl,import
	prune-backups keep-all=1
	shared 0

dir: backup
	path /mnt/pve/backup
	content vztmpl,snippets,iso,import,backup
	shared 0

