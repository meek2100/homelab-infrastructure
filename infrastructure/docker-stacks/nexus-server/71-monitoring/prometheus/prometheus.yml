# Prometheus Core Configuration - Nexus Server (Homelab Ingress VM 100)
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']

  - job_name: 'blackbox_exporter'
    static_configs:
      - targets: ['blackbox-exporter:9115']

  - job_name: 'snmp_infrastructure'
    static_configs:
      - targets:
        - 192.168.1.1
        labels:
          device_name: 'araknis-520-router'
          device_type: 'router'
      - targets:
        - 192.168.1.215
        labels:
          device_name: 'araknis-920-switch'
          device_type: 'switch'
    metrics_path: /snmp
    params:
      module: [if_mib]
      auth: [public_v2]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: snmp-exporter:9116

  - job_name: 'snmp_access_points'
    static_configs:
      - targets:
        - 192.168.1.231
        labels:
          device_name: 'araknis-830-ap1'
          device_type: 'ap'
          location: 'House Front'
      - targets:
        - 192.168.1.236
        labels:
          device_name: 'araknis-830-ap2'
          device_type: 'ap'
          location: 'House Back'
      - targets:
        - 192.168.1.237
        labels:
          device_name: 'araknis-830-ap3'
          device_type: 'ap'
          location: 'Office Bridge'
    metrics_path: /snmp
    params:
      module: [ap_system]
      auth: [public_v2]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: snmp-exporter:9116

  - job_name: 'node_exporter'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          instance_name: 'nexus-server'
      - targets: ['192.168.40.249:9100']
        labels:
          instance_name: 'luna-server'
      - targets: ['192.168.40.247:9100']
        labels:
          instance_name: 'media-server'
      - targets: ['192.168.40.186:9100']
        labels:
          instance_name: 'nexus-server2'
      - targets: ['192.168.40.175:9100']
        labels:
          instance_name: 'minecraft-server'

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          instance_name: 'nexus-server'
      - targets: ['192.168.40.249:8088']
        labels:
          instance_name: 'luna-server'
      - targets: ['192.168.40.247:8088']
        labels:
          instance_name: 'media-server'
      - targets: ['192.168.40.186:8088']
        labels:
          instance_name: 'nexus-server2'
      - targets: ['192.168.40.175:8088']
        labels:
          instance_name: 'minecraft-server'

  - job_name: 'snmp_printers'
    static_configs:
      - targets:
        - 192.168.10.195
        labels:
          device_name: 'hp-color-laserjet-m283cdw'
          device_type: 'printer'
          model: 'HP Color LaserJet MFP M283cdw'
      - targets:
        - 192.168.10.196
        labels:
          device_name: 'brother-ql-1110nwb'
          device_type: 'label_printer'
          model: 'Brother QL-1110NWB'
    metrics_path: /snmp
    params:
      module: [printer_mib]
      auth: [public]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: snmp-exporter:9116

  - job_name: 'proxmox_pve'
    metrics_path: /pve
    params:
      module: [pve]
      cluster: ['1']
      node: ['1']
    static_configs:
      - targets:
        - 192.168.1.250
        labels:
          node: 'pve'
          model: 'Dell Precision 5520'
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: pve-exporter:9221

  - job_name: 'proxmox_pve2'
    metrics_path: /pve
    params:
      module: [pve2]
      cluster: ['1']
      node: ['1']
    static_configs:
      - targets:
        - 192.168.1.240
        labels:
          node: 'pve2'
          model: 'Awow AK34Pro'
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: pve-exporter:9221

  - job_name: 'proxmox_pve3'
    metrics_path: /pve
    params:
      module: [pve3]
      cluster: ['1']
      node: ['1']
    static_configs:
      - targets:
        - 192.168.1.245
        labels:
          node: 'pve3'
          model: 'HP EliteDesk'
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: pve-exporter:9221

  - job_name: 'blackbox_http'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
        - http://192.168.40.185:3030
        labels:
          service: 'grafana'
      - targets:
        - http://192.168.40.185:81
        labels:
          service: 'nginx-proxy-manager'
      - targets:
        - http://192.168.40.249:8123
        labels:
          service: 'home-assistant'
      - targets:
        - http://192.168.40.247:32400/identity
        labels:
          service: 'plex-media-server'
      - targets:
        - https://192.168.40.185:9443
        labels:
          service: 'portainer'
      - targets:
        - http://192.168.40.249:8581
        labels:
          service: 'homebridge'
      - targets:
        - http://192.168.40.249:7912
        labels:
          service: 'spoolman'
      - targets:
        - http://192.168.40.247:13378
        labels:
          service: 'audiobookshelf'
      - targets:
        - http://192.168.40.247:7575
        labels:
          service: 'homarr'
      - targets:
        - http://192.168.40.247:5055
        labels:
          service: 'overseerr'
      - targets:
        - http://192.168.40.247:8083
        labels:
          service: 'calibre-web'
      - targets:
        - http://192.168.40.247:8084
        labels:
          service: 'filebrowser'
      - targets:
        - http://192.168.40.186:8081
        labels:
          service: 'adguard-secondary-ui'
      - targets:
        - http://192.168.40.248:80
        labels:
          service: 'openmediavault-nas'
      - targets:
        - http://192.168.40.249:8123
        labels:
          service: 'home-assistant'
          category: 'smarthome'
      - targets:
        - http://192.168.40.249:8581
        labels:
          service: 'homebridge'
          category: 'smarthome'
      - targets:
        - http://192.168.10.200
        labels:
          service: 'control4-ca10-director'
          category: 'control4'
      - targets:
        - http://192.168.10.35
        labels:
          service: 'control4-core1'
          category: 'control4'
      - targets:
        - http://192.168.10.153
        labels:
          service: 'control4-core3'
          category: 'control4'
      - targets:
        - http://192.168.10.201
        labels:
          service: 'control4-t5-touchscreen'
          category: 'control4'
      - targets:
        - http://192.168.30.90
        labels:
          service: 'mainsail-klipper'
          category: '3d-printing'
      - targets:
        - http://192.168.30.90:7125
        labels:
          service: 'moonraker-api'
          category: '3d-printing'
      - targets:
        - http://192.168.10.195
        labels:
          service: 'hp-laserjet-web'
          category: 'printer'
      - targets:
        - http://192.168.10.196
        labels:
          service: 'brother-printer-web'
          category: 'printer'
      - targets:
        - https://theurer.dev
        labels:
          service: 'theurer-dev-web'
          environment: 'external'
      - targets:
        - https://mail.theurer.dev
        labels:
          service: 'mail-theurer-dev-web'
          environment: 'external'
      - targets:
        - http://192.168.1.205
        labels:
          service: 'pakedge-sx8p-switch'
          category: 'network'
          environment: 'testbench-ondemand'
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: 'blackbox_dns'
    metrics_path: /probe
    params:
      module: [dns_udp]
    static_configs:
      - targets:
        - 192.168.40.185:53
        labels:
          resolver: 'adguard-primary-nexus1'
      - targets:
        - 192.168.40.186:53
        labels:
          resolver: 'adguard-secondary-nexus2'
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: 'blackbox_ssl'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
        - https://192.168.40.185:9443
        labels:
          endpoint: 'portainer-tls'
      - targets:
        - https://theurer.dev
        labels:
          endpoint: 'theurer-dev-ssl'
      - targets:
        - https://mail.theurer.dev
        labels:
